<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Carousel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" defer></script>

  <style>
    /* ===== カルーセル全体 ===== */
    #carouselExampleFade {
      height: 500px;
      position: relative;
      background-color: #000;
    }

    /* ===== 各スライド：上下中央 ===== */
    #carouselExampleFade .carousel-item {
      height: 500px;
      display: flex;
      align-items: center;     /* 上下中央 */
      justify-content: center; /* 横中央 */
    }

    /* ===== 全画像共通 ===== */
    #carouselExampleFade img {
      width: 100%;        /* 横幅はそのまま */
      height: 350px;      /* ★ 全部同じ高さに圧縮 */
      object-fit: fill;   /* ★ 比率無視＝つぶす（切り抜きなし） */
      display: block;
    }

    /* ===== 文字・ボタン（常時表示） ===== */
    .fixed-caption {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      z-index: 10;
      width: 100%;
      padding: 0 15px;
    }
  </style>
</head>

<body>

<main>

  <!-- ===== カルーセル開始 ===== -->
  <div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-ride="carousel">

    <!-- 文字・ボタン（スライドしても消えない） -->
    <div class="fixed-caption">
      <h1>Example headline.</h1>
      <p>
        Cras justo odio, dapibus ac facilisis in, egestas eget quam.
        Donec id elit non mi porta gravida at eget metus.
      </p>
      <a class="btn btn-primary btn-lg" href="#">Sign up today</a>
    </div>

    <div class="carousel-inner">

      <!-- 1枚目 -->
      <div class="carousel-item active">
        <img src="img/top_1.jpg" alt="Slide 1">
      </div>

      <!-- 2枚目 -->
      <div class="carousel-item">
        <img src="img/top_2.jpg" alt="Slide 2">
      </div>

      <!-- 3枚目 -->
      <div class="carousel-item">
        <img src="img/top_3.jpg" alt="Slide 3">
      </div>

    </div>

    <!-- 操作ボタン -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
  <!-- ===== カルーセル終了 ===== -->

</main>

</body>
</html>
